name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'crxig-rxberts/code-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git remote credentials
        # release-it-containerized runs in a Docker container that only mounts
        # $GITHUB_WORKSPACE, not /home/runner/work/_temp. actions/checkout's
        # persisted credentials live in a temp-file `include.path`, which is
        # invisible inside the container, so `git push` fails with
        # "could not read Username for 'https://github.com'". Embed the token
        # directly in the origin URL (stored in the mounted .git/config) instead.
        run: git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_IT_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Run release automation
        uses: juancarlosjr97/release-it-containerized@496c538649ff70685250f5f3817b61c1403d82df # 2.2.6
        with:
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ secrets.GIT_USERNAME }}
          github_token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          plugins_list: "@release-it/conventional-changelog"

  publish:
    name: Publish to npm
    needs: release
    if: github.repository == 'crxig-rxberts/code-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
