name: release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    if: github.repository == 'crxig-rxberts/code-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run release automation
        uses: juancarlosjr97/release-it-containerized@25a44812d10962ca6b9093717f0a58a5ae005c4c # 2.2.5
        with:
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ secrets.GIT_USERNAME }}
          github_token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          plugins_list: "@release-it/conventional-changelog"

  publish:
    name: Publish to npm
    needs: release
    if: github.repository == 'crxig-rxberts/code-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
