name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'crxig-rxberts/code-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git remote credentials
        # release-it-containerized runs in a Docker container that only mounts
        # $GITHUB_WORKSPACE, not /home/runner/work/_temp. actions/checkout's
        # persisted credentials live in a temp-file `include.path`, which is
        # invisible inside the container, so `git push` fails with
        # "could not read Username for 'https://github.com'". Embed the token
        # directly in the origin URL (stored in the mounted .git/config) instead.
        run: git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_IT_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      # Workspace (npm package) release runs first: only bumps/tags/releases
      # when packages/commit-hooks/{index.mjs,bin}/package.json actually
      # changed. publish.yml triggers on the commit-hooks-v* tag this
      # produces.
      - name: Run workspace release automation
        uses: juancarlosjr97/release-it-containerized@33efd20a1083ecbabfc4da3a0884fff2eb3434b9 # 2.2.7
        with:
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ secrets.GIT_USERNAME }}
          github_token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          plugins_list: "@release-it/conventional-changelog"
          command: "--config packages/commit-hooks/.release-it.workspace.mjs"

      # Root release tracks every commit to main regardless of type. Tags
      # v${version}, never touches package.json, never publishes.
      - name: Run root release automation
        uses: juancarlosjr97/release-it-containerized@33efd20a1083ecbabfc4da3a0884fff2eb3434b9 # 2.2.7
        with:
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ secrets.GIT_USERNAME }}
          github_token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          plugins_list: "@release-it/conventional-changelog"
          command: "--config .release-it.mjs"
